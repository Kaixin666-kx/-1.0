<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" charset="width=device-width,
		initial-scale=1.0">
		<title>login</title>
		  <!-- 字体 -->
		  <link href="https://fonts.font.im/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
		  <!-- 图标 -->
		  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
		  <!-- 样式 -->
		  <link rel="stylesheet" href="styles.css">
		  <link rel="stylesheet" href="a.css">
	</head>
	<body>
           <!-- 登录容器 -->
           <section class="login-container">
               
               <!-- 左侧：跑马灯与背景 -->
               <section class="hero">
                   <!-- 跑马灯背景层 -->
                   <div class="marquee-section">
                       <img src="./img/background.png" class="bg-image">
                       <img src="./img/a1.gif" class="subject-image">
                       
                       <!-- 跑马灯文字 -->
                       <div class="marquee">
                           <div class="marquee-inner">
                               <h1><span>NEW RELEASE</span><i class="fas fa-star-of-life"></i></h1>
                               <h1><span>NEW RELEASE</span><i class="fas fa-star-of-life"></i></h1>
                           </div>
                       </div>
                       <div class="marquee">
                           <div class="marquee-inner">
                               <h1><span>NEW RELEASE</span><i class="fas fa-star-of-life"></i></h1>
                               <h1><span>NEW RELEASE</span><i class="fas fa-star-of-life"></i></h1>
                           </div>
                       </div>
                   </div>
               </section>
           
               <!-- 右侧：登录表单 -->
               <section id="login-form" class="glass">
                   <!-- 标题 -->
                   <h1 class="animate in-1">WELCOME</h1>
                   
                   <!-- 账号输入框 -->
                   <div class="input-wrap animate in-2">
                       <input type="text" placeholder="请输入你的账号" spellcheck="false" required>
                       <i class="fa-solid fa-user"></i>
                   </div>
                   
                   <!-- 密码输入框 -->
                   <div class="input-wrap animate in-3">
                       <input type="password" placeholder="请输入你的密码" spellcheck="false" required>
                       <i class="fa-solid fa-lock"></i>
                   </div>
                   
                   <!-- 记住我 + 忘记密码 -->
                   <div class="rem animate in-4">
                       <p>
                           <input class="glass" type="checkbox"> 记住我
                       </p>
                       <a href="#">忘记密码</a>
                   </div>
                   
                   <!-- 登录按钮 -->
                   <button class="animate glass in-5">登录</button>
                   
                   <!-- 注册链接 -->
                   <p class="animate in-6 reg">
                       Don't have an account? <a href="#">Register</a>
                   </p>
               </section>
               
           </section>
		   
		   
	</body>
</html>
